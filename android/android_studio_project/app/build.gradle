plugins {
    id 'com.android.application'
}

// The official Social SDK is distributed through the Discord Developer Portal.
// Opt in explicitly; ordinary Android and desktop builds have no SDK dependency.
def discordSdkPath = providers.gradleProperty('xeniaDiscordSdk').orNull
def discordSdk = discordSdkPath ? file(discordSdkPath) : null
def androidStl = discordSdk ? '-DANDROID_STL=c++_shared' : '-DANDROID_STL=c++_static'
if (discordSdk && (!discordSdk.isFile() || !discordSdk.name.endsWith('.aar'))) {
    throw new GradleException('xeniaDiscordSdk must point to the official Android Social SDK AAR (1.10 or newer).')
}

android {
    namespace 'jp.xenia.emulator'
    compileSdk 35
    ndkVersion '29.0.14206865'
    buildFeatures { prefab = discordSdk != null }
    sourceSets.main.java.srcDir(discordSdk ? 'src/discord/java' : 'src/noDiscord/java')

    defaultConfig {
        applicationId 'jp.xenia.emulator'
        minSdk 30
        targetSdk 35
        versionCode providers.gradleProperty('xeniaVersionCode').getOrElse('1').toInteger()
        versionName providers.gradleProperty('xeniaVersionName').getOrElse('Development')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments androidStl,
                        '-DXENIA_BUILD_TESTS=OFF', '-DXENIA_BUILD_MISC=OFF',
                        "-DCMAKE_JOB_POOLS=xenia_compile=${providers.gradleProperty('xeniaBuildJobs').getOrElse('8')}",
                        '-DCMAKE_JOB_POOL_COMPILE=xenia_compile',
                        "-DXENIA_HOST_SHADER_CC=${providers.gradleProperty('xeniaHostShaderCompiler').getOrElse('')}"
                targets 'xenia-app'
                if (discordSdk) {
                    arguments '-DXENIA_ANDROID_DISCORD=ON'
                }
                if (providers.gradleProperty('xeniaProfiler').isPresent()) {
                    arguments "-DXENIA_ENABLE_PROFILER=${providers.gradleProperty('xeniaProfiler').get()}"
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    flavorDimensions 'distribution'
    productFlavors {
        github {
            dimension 'distribution'
            applicationIdSuffix '.github'
        }
        googlePlay {
            dimension 'distribution'
        }
    }
    if (discordSdk) {
        sourceSets.github.manifest.srcFile 'src/discord/AndroidManifest.xml'
        sourceSets.googlePlay.manifest.srcFile 'src/discord/AndroidManifest.xml'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Use the JNI glue from the same SDL revision as the desktop audio backend.
    sourceSets.main.java.srcDir '../../../third_party/SDL3/android-project/app/src/main/java'
    lint { lintConfig = file('lint.xml') }

    externalNativeBuild {
        cmake {
            path file('../../../CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    if (discordSdk) {
        implementation files(discordSdk)
        // Required by classes shipped in the AAR, even though RPC needs no OAuth UI.
        implementation 'androidx.browser:browser:1.8.0'
    }
    implementation 'org.jetbrains:annotations:15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

// Build-time reuse of upstream translations; no translation tables in Java.
def desktopLocaleOutput = layout.buildDirectory.dir('generated/desktop-locales')
def desktopLocales = tasks.register('generateDesktopLocales', Exec) {
    inputs.dir('../../../assets/locale')
    inputs.dir('src/main/res')
    inputs.files('../../../tools/build/android_locales.py', '../../../tools/build/compile_po.py')
    inputs.file('../../../src/xenia/ui/profile_options.h')
    outputs.dir(desktopLocaleOutput)
    commandLine 'python', file('../../../tools/build/android_locales.py'), file('../../..'), desktopLocaleOutput.get().asFile
}
android.sourceSets.main.res.srcDir(desktopLocaleOutput)
tasks.named('preBuild').configure { dependsOn(desktopLocales) }
